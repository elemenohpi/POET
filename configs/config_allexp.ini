mut_change_character = 0.1
parsimony_pressure = 0.0

enable_gaps = True
matching_mode = substring

# Regex mode (unused here)
regex_alphabet = data/translation/regex_alphabet.csv
max_depth_tree = 4
min_braces = 1
max_braces = 3
init_method = half
mut_replace_rule = 0.1
mut_replace_subtree = 0.1
mut_add_aa = 0.1
mut_replace_node = 0.1

# ALL experimental features ON
exp_char_classes = True
exp_variable_gaps = True
exp_weighted_positions = True
exp_pw_threshold = 0.7
exp_composition = True
exp_match_count = True
exp_circular = True
