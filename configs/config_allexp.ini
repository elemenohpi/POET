# Experimental all-features-on config 
# Copy of config.ini with all experimental features enabled and only 5 generations
seed = 42
diversity_selection = True
diversity_weight = 0.05
learn_data = data/uPAR-binding-peptides-epoch0.csv
population_size = 100
maximum_rule_size = 6
maximum_rule_count = 100
rule_weight_min = 0.0
rule_weight_max = 10.0
runs = 5
crossover_unused_selection_chance = 0.2
