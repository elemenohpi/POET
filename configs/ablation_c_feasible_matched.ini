# Mutation-selection ablation — ARM C (rate-matched control)
#
# Arm B, but with every mutation rate scaled down so the number of mutations
# that ACTUALLY LAND matches arm A. This separates "smarter operator choice"
# from "simply more mutation".
#
#   B beats A and B beats C  -> the feasibility logic itself helps
#   B beats A but B == C     -> all you did was raise the mutation rate
#   B == A                   -> no effect; keep the simpler code
#
# mutation_rate_scale below was measured from a 100-generation arm A run on
# this config (seed 333): 20.9% of all mutation rolls did nothing, so 0.7906
# of the nominal mutation mass actually landed.
#
# Re-measure if you change the mutation rates, maximum_rule_size,
# maximum_rule_count, or the dataset: run arm A with mutation_stats = True and
# copy the value it prints on the "Rate-matched control arm:" line.
experiment_label = mut_C_feasible_matched
seed = 333

sequence_mode = token
token_delimiter = space
alphabet_data = chimera_init_data/chimera_token_alphabet.csv
alphabet_column = code
allow_reverse_match = False

learn_data = data/chimera_multihance_relative.csv

population_size = 100
maximum_rule_size = 4
maximum_rule_count = 80
rule_weight_min = 0.0
rule_weight_max = 10.0
runs = 100
crossover_unused_selection_chance = 0.2
fitness_alg = correlation
tournament_size = 5

output_evo = output/ablation/evo_c.csv
output_model = output/ablation/model_c.csv

diversity_selection = True
diversity_weight = 0.05
parsimony_pressure = 0.001
optimize_weights = False

matching_mode = substring
enable_gaps = True

mut_add_rule = 0.25
mut_remove_rule = 0.15
mut_change_weight = 0.2
mut_add_to_pattern = 0.12
mut_remove_from_pattern = 0.08
mut_change_character = 0.12
mut_insert_gap = 0.05
mut_remove_gap = 0.05

mutation_selection = feasible
mutation_rate_scale = 0.7906
mutation_stats = True

exp_char_classes = False
exp_variable_gaps = False
exp_weighted_positions = False
exp_pw_threshold = 0.7
exp_composition = False
exp_match_count = False
exp_circular = False
max_variable_gap = 6
max_class_size = 0
mut_char_class = 0.0
mut_variable_gap = 0.0
mut_position_weight = 0.0
mut_composition = 0.0

use_cgp = False
