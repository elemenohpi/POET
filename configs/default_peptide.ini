# General
seed = 333

# Translation
diversity_selection = True
diversity_weight = 0.05

# Learn/test data
learn_data = data/uPAR-binding-peptides-epoch1.csv

# Hyper-parameters
population_size = 100
maximum_rule_size = 6
maximum_rule_count = 100
rule_weight_min = 0.0
rule_weight_max = 10.0
runs = 100
crossover_unused_selection_chance = 0.2
# could be set to correlation or RMSE
fitness_alg = correlation

tournament_size = 5

# Output
output_evo = output/evo.csv
output_model = output/model.csv

# Mutation
# on model
mut_add_rule = 0.2
mut_remove_rule = 0.2

# on rule
mut_change_weight = 0.2
mut_add_to_pattern = 0.1
mut_remove_from_pattern = 0.1
mut_change_character = 0.1
mut_insert_gap = 0.1
mut_remove_gap = 0.1

# Parsimony pressure: penalise model complexity (number of rules).
# The penalty added to fitness = parsimony_pressure * rule_count.
# 0.0 disables it (default).
parsimony_pressure = 0.000

# Gradient-based weight optimisation (bounded least-squares).
# When True, mut_change_weight is disabled and rule weights are set
# analytically each generation.  Default: False.
optimize_weights = False

# Enable gapped motifs (e.g. A___B where _ matches any amino acid).
# Set to False to use classic exact-substring matching only.
enable_gaps = True

# Matching Mode
# matching_mode: "substring" (default) or "regex"
# When set to "regex", rules are tree-based regular expressions
# and tree-specific mutations are used instead of character-level ones.
matching_mode = substring

# Regex Mode Settings (only used when matching_mode = regex)
regex_alphabet = data/translation/regex_alphabet.csv
max_depth_tree = 4
min_braces = 1
max_braces = 3
init_method = half
mut_replace_rule = 0.1
mut_replace_subtree = 0.1
mut_add_aa = 0.1
mut_replace_node = 0.1

# Experimental Features (substring mode only)
# All default to False. Enable individually to test.

# Character classes - e.g. [AG]K matches AK or GK
exp_char_classes = True

# Variable-length gaps - e.g. A_{2,5}B (A, 2-5 any, B)
exp_variable_gaps = True

# Per-position importance weights that modulate match quality
exp_weighted_positions = False
# Minimum weighted match quality to count as a match (0.0-1.0)
exp_pw_threshold = 0.7

# AND/OR composition of rules via groups
exp_composition = False

# Scale weight by number of matches, not just presence
exp_match_count = False

# Circular permutation matching (wrap-around sequences)
exp_circular = False

# Maximum span for a variable-length gap element
max_variable_gap = 6

# Max amino acids allowed inside any [] character class (0 = unlimited).
# Only relevant when exp_char_classes = True.
max_class_size = 4

# Experimental mutation rates (only active when the corresponding feature is True)
mut_char_class = 0.1
mut_variable_gap = 0.1
mut_position_weight = 0.1
mut_composition = 0.05

# CGP Post-Processing Layer
# When enabled, runs Cartesian Genetic Programming on the best POET model
# after evolution completes, learning a non-linear combination of rule matches
# instead of the default additive prediction.
# Requires the cgp/ package to be present in the project root.
use_cgp = False

# Path to unseen/test data for CGP evaluation (defaults to learn_data if unset)
# unseen_data = data/unseen.csv

# CGP hyperparameters
cgp_generations = 1000
cgp_model_size = 32
cgp_parents = 1
cgp_children = 4
cgp_mutation_type = full
cgp_mutation_rate = 1.0
cgp_selection_type = paretoelite
cgp_fitness_function = correlation
cgp_n_elites = 1
cgp_tournament_size = 4
cgp_step_size = 10
