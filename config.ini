# General
seed = 333

# Translation
diversity_selection = True
diversity_weight = 0.05

# Learn/test data
learn_data = data/uPAR-binding-peptides-epoch0.csv

# Hyper-parameters
population_size = 100
maximum_rule_size = 6
maximum_rule_count = 100
rule_weight_min = 0.0
rule_weight_max = 10.0
runs = 10
crossover_unused_selection_chance = 0.2
# could be set to correlation or RMSE
fitness_alg = correlation

tournament_size = 5

# 0 is the summation mode and 1 is the multiplication mode
pattern_mode = 0

# Output
output_evo = output/evo.csv
output_model = output/model.csv

# Mutation
# on model
mut_add_rule = 0.2
mut_remove_rule = 0.2

# on rule
mut_change_weight = 0.2
mut_add_to_pattern = 0.1
mut_remove_from_pattern = 0.1
mut_insert_gap = 0.1
mut_remove_gap = 0.1

# Enable gapped motifs (e.g. A___B where _ matches any amino acid).
# Set to False to use classic exact-substring matching only.
enable_gaps = True

# ── Matching Mode ──
# matching_mode: "substring" (default) or "regex"
# When set to "regex", rules are tree-based regular expressions
# and tree-specific mutations are used instead of character-level ones.
matching_mode = substring

# ── Regex Mode Settings (only used when matching_mode = regex) ──
regex_alphabet = data/translation/regex_alphabet.csv
max_depth_tree = 4
min_braces = 1
max_braces = 3
init_method = half
mut_replace_rule = 0.1
mut_replace_subtree = 0.1
mut_add_aa = 0.1
mut_replace_node = 0.1

